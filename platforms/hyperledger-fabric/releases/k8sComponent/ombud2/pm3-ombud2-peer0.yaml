global:
  version: 2.5.4
  serviceAccountName: vault-auth
  cluster:
    provider: minikube
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://192.168.49.1:8200
    authPath: localombud2
    secretEngine: secretsv2
    secretPrefix: "data/localombud2"
    role: vault-role
    tls: false
  proxy:
    provider: none
    externalUrlSuffix: develop.local.com

image:
  fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  #fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  #alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  pullSecret: ""

peer:
  name: peer0
  type: anchor
  address: peer0.ombud2-net:7051
  localMspId: ombud2MSP
  logLevel: debug
  tlsStatus: true
  channelName: pm3  
  ordererAddress: orderer1.pm3org-net:7050
  addPeerValue: false
  addnewOrgValue: false
